<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YT Nền</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: #0f0f0f; color: #f1f1f1; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .b { max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  h1 span { color: #ff3b5c; }
  p { color: #aaa; }
</style>
</head>
<body>
<div class="b">
  <h1>▶ YT <span>Nền</span></h1>
  <p>Ứng dụng đã chuyển sang máy chủ riêng và chỉ dành cho tài khoản được cấp.<br>Vui lòng dùng địa chỉ mà quản trị viên đã gửi cho bạn.</p>
</div>
<script>
  // Dọn phiên bản cũ: gỡ service worker, bộ nhớ đệm và dữ liệu đã tải của trang cũ.
  try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())); } catch {}
  try { caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))); } catch {}
  try { indexedDB.deleteDatabase('ytbg'); } catch {}
  try { Object.keys(localStorage).filter((k) => k.startsWith('ytbg:')).forEach((k) => localStorage.removeItem(k)); } catch {}
</script>
</body>
</html>
